blueprint:
  name: Smart Adhan (East London Mosque live, local fallback)
  description: >-
    At each prayer time, plays East London Mosque's live adhan if the mosque is
    broadcasting. Otherwise it plays a local adhan recording instead.
    Requires the East London Mosque Adhan integration.
  domain: automation
  source_url: https://github.com/Tinkering247/ha-elm-adhan/blob/main/blueprints/automation/elm_adhan/smart_adhan.yaml
  homeassistant:
    min_version: "2025.8.0"
  input:
    trigger_section:
      name: Prayer times
      icon: mdi:clock-outline
      input:
        prayer_entity:
          name: Prayer time entity
          description: >-
            An entity whose state changes to the prayer name at each prayer time,
            such as `lupt.lupt` from London Unified Prayer Times.
          selector:
            entity: {}
        prayers:
          name: Prayers
          description: The states that trigger the adhan.
          default: [Fajr, Zuhr, Asr, Maghrib, Ishā]
          selector:
            text:
              multiple: true
        fajr_name:
          name: Name of the Fajr state
          description: Used for the Fajr volume and stop time below.
          default: Fajr
          selector:
            text: {}
    playback_section:
      name: Playback
      icon: mdi:speaker
      input:
        speakers:
          name: Speakers
          description: Played with `media_player.play_media`.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: media_player
        extractor_speakers:
          name: Speakers that need Media Extractor
          description: >-
            Played with `media_extractor.play_media` instead. Some Cast
            speakers need this for Mixlr streams. Requires the Media Extractor
            integration.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: media_player
        pause_players:
          name: Pause first
          description: Media players to pause before the adhan, such as a TV.
          default: []
          selector:
            entity:
              multiple: true
              filter:
                domain: media_player
        volume:
          name: Volume
          description: Set to 0 to leave the volume unchanged.
          default: 0.4
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
              mode: slider
        fajr_volume:
          name: Fajr volume
          description: Set to 0 to use the volume above.
          default: 0
          selector:
            number:
              min: 0
              max: 1
              step: 0.05
              mode: slider
        stop_after:
          name: Stop after (minutes)
          description: >-
            The live broadcast carries on into the prayer and any talk. Stop
            the speakers after this long. Set to 0 to never stop.
          default: 30
          selector:
            number:
              min: 0
              max: 180
              unit_of_measurement: min
        fajr_stop_after:
          name: Stop after at Fajr (minutes)
          description: Set to 0 to use the value above.
          default: 0
          selector:
            number:
              min: 0
              max: 180
              unit_of_measurement: min
        fallback_media:
          name: Fallback adhan
          description: >-
            Media content ID (URL or media-source path) to play when the live
            stream is unavailable. Leave empty to play nothing.
          default: ""
          selector:
            text: {}
    stream_section:
      name: Live stream
      icon: mdi:broadcast
      collapsed: true
      input:
        live_entity:
          name: Live sensor
          default: binary_sensor.elm_adhan_live
          selector:
            entity:
              filter:
                integration: elm_adhan
                domain: binary_sensor
        url_entity:
          name: Stream URL sensor
          default: sensor.elm_adhan_stream_url
          selector:
            entity:
              filter:
                integration: elm_adhan
                domain: sensor
        wait_for_live:
          name: Wait for the broadcast to start
          description: >-
            Seconds to wait for the mosque to go live after the prayer time
            before falling back. The broadcast often starts a little late.
          default: 90
          selector:
            number:
              min: 0
              max: 600
              unit_of_measurement: s

mode: restart

triggers:
  - trigger: state
    entity_id: !input prayer_entity
    to: !input prayers

variables:
  live_entity: !input live_entity
  url_entity: !input url_entity
  speakers: !input speakers
  extractor_speakers: !input extractor_speakers
  pause_players: !input pause_players
  fajr_name: !input fajr_name
  wait_for_live: !input wait_for_live
  fallback_media: !input fallback_media
  is_fajr: "{{ trigger.to_state.state == fajr_name }}"
  base_volume: !input volume
  fajr_volume: !input fajr_volume
  volume: "{{ fajr_volume if is_fajr and fajr_volume | float(0) > 0 else base_volume }}"
  base_stop: !input stop_after
  fajr_stop: !input fajr_stop_after
  stop_minutes: "{{ fajr_stop if is_fajr and fajr_stop | int(0) > 0 else base_stop }}"
  all_speakers: "{{ (speakers + extractor_speakers) | unique | list }}"

actions:
  - if:
      - condition: template
        value_template: "{{ pause_players | length > 0 }}"
    then:
      - action: media_player.media_pause
        target:
          entity_id: "{{ pause_players }}"
        continue_on_error: true

  # Re-check Mixlr every 15 s, so a late broadcast is caught and the URL is
  # current rather than up to one polling interval old.
  - repeat:
      sequence:
        - action: homeassistant.update_entity
          target:
            entity_id: "{{ live_entity }}"
        - if:
            - condition: template
              value_template: "{{ not is_state(live_entity, 'on') and repeat.index * 15 < wait_for_live }}"
          then:
            - delay:
                seconds: 15
      until:
        - condition: template
          value_template: "{{ is_state(live_entity, 'on') or repeat.index * 15 >= wait_for_live }}"

  - variables:
      media: >-
        {% if is_state(live_entity, 'on')
              and states(url_entity) not in ['unknown', 'unavailable', 'none', ''] %}
          {{ states(url_entity) }}
        {% else %}
          {{ fallback_media }}
        {% endif %}

  - condition: template
    value_template: "{{ media | length > 0 and all_speakers | length > 0 }}"

  - action: media_player.turn_on
    target:
      entity_id: "{{ all_speakers }}"
    continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ volume | float(0) > 0 }}"
    then:
      - action: media_player.volume_set
        target:
          entity_id: "{{ all_speakers }}"
        data:
          volume_level: "{{ volume | float }}"
        continue_on_error: true

  - parallel:
      - if:
          - condition: template
            value_template: "{{ speakers | length > 0 }}"
        then:
          - action: media_player.play_media
            target:
              entity_id: "{{ speakers }}"
            data:
              media_content_id: "{{ media }}"
              media_content_type: music
            continue_on_error: true
      - if:
          - condition: template
            value_template: "{{ extractor_speakers | length > 0 }}"
        then:
          - action: media_extractor.play_media
            target:
              entity_id: "{{ extractor_speakers }}"
            data:
              media_content_id: "{{ media }}"
              media_content_type: music
            continue_on_error: true

  - if:
      - condition: template
        value_template: "{{ stop_minutes | int(0) > 0 }}"
    then:
      - delay:
          minutes: "{{ stop_minutes | int }}"
      - action: media_player.media_stop
        target:
          entity_id: "{{ all_speakers }}"
        continue_on_error: true
